[FILE]
pointcloud_folder = pointclouds/
label_folder = pointclouds/

[POINTCLOUD]
point_size = 4.0
colorless_color = 0.9, 0.9, 0.9
colorless_colorize = True
std_translation = 0.03
std_zoom = 0.0025
color_with_label = True
label_color_mix_ratio = 0.3

[USER_INTERFACE]
coordinate_precision = 3
language = zh_CN
show_floor = True
background_color = 255,255,255
near_plane = 1
far_plane = 10000
keep_perspective = False
auto_pick_rotation_center = True
zoom_to_cursor = True

[GROUND_FILTER]
units_per_meter = 1.0
resolution = 1.0
threshold = 0.5
rigidness = 3
slope_smooth = True
iterations = 500
time_step = 0.65
